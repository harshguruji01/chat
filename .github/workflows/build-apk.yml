name: Build Guru Chat Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Guru Chat APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Lint & Tests
        run: pnpm run lint && pnpm test

      - name: Build Web Production Bundle
        run: pnpm run build

      - name: Sync Capacitor Android
        run: pnpm exec cap sync android

      - name: Build APK with Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GuruChat-v3.0.0-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Prepare Release APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/guruchat-v3.0.0.apk

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.0
          name: "Guru Chat v3.0.0 (Android + Web)"
          body: |
            ### 🚀 Guru Chat v3.0.0 — By HarshGuruJi

            **Highlights:**
            - 💬 Real-time 1:1 & Group Messaging (replies, reactions, pins, roles, announcement mode)
            - 📞 Authenticated 1:1 Voice & Video Calls (Web ↔ Android WebRTC + TURN support)
            - 🎥 Group Conferencing (scheduled & instant meetings, screen share, raise hand, host controls, breakout rooms)
            - 👥 Contact Directory & Granular Privacy Controls
            - 🔔 Cross-Platform Notifications & Device Session Management
          files: android/app/build/outputs/apk/debug/guruchat-v3.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
